name: ci-cd

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Set up Python 3.10.6
      uses: actions/setup-python@v2
      with:
        python-version: 3.10.6

    - name: Check-out repository
      uses: actions/checkout@v2

    - name: Set up Git authentication
      run: git config --global url."https://${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"

    - name: Install dependencies
      env:
        PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      run: |
        python -m pip install --upgrade pip
        curl -sSL https://install.python-poetry.org | python3 -
        python -m pip install .

    - name: Print current directory
      run: |
        pwd
        ls -la

    - name: Run tests
      run: |
        cd ./tests/
        python -m unittest output_test.py
        python -m unittest soc_test.py
        python -m unittest soc_inventory_test.py
        python -m unittest soc_n2o_test.py
        python -m unittest transition_key_test.py
        python -m unittest implied_factor_test.py
        python -m unittest n2o_drainage_factors_test.py
        python -m unittest time_period_test.py
        python -m unittest cropland_readiness_test.py
        python -m unittest inventory_alignment_test.py
        python -m unittest forest_fire_factors_test.py
        python -m unittest grassland_cropland_fire_test.py
        python -m unittest units_test.py
        python -m unittest wetland_factors_test.py
        python -m unittest peat_export_test.py
        python -m unittest examples_test.py
        python -m unittest argument_order_test.py
        python -m unittest geo_soc_test.py
        python -m unittest forest_fire_switch_test.py
        python -m unittest forest_drainage_co2_test.py
        python -m unittest spelling_test.py
